<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Instabilidade temporária | Desentupidora Chama Nóis</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f8;
            color: #19313a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 560px);
            padding: clamp(28px, 7vw, 56px);
            border: 1px solid #e0e8eb;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 55px rgb(25 49 58 / 9%);
            text-align: center;
        }

        .status {
            display: inline-grid;
            width: 76px;
            height: 76px;
            place-items: center;
            border-radius: 50%;
            background: #fff2df;
            color: #a95a00;
            font-size: 1.3rem;
            font-weight: 800;
        }

        h1 {
            margin: 24px 0 12px;
            font-size: clamp(1.7rem, 5vw, 2.25rem);
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #52676f;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 0 22px;
            border-radius: 10px;
            background: #087f5b;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: #066849;
        }

        a:focus-visible {
            outline: 3px solid #19313a;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <div class="status" aria-label="Erro 500">500</div>
        <h1>Estamos com uma instabilidade</h1>
        <p>
            Não foi possível concluir sua solicitação agora.
            Tente novamente em alguns instantes.
        </p>
        <a href="/">Voltar para o início</a>
    </main>
</body>
</html>
