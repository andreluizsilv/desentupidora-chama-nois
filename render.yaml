services:
  - type: web
    name: chama-nois-web
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/render_start.sh
    disk:
      name: uploaded-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: chama-nois-web.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: chama-nois-db
          property: connectionString

databases:
  - name: chama-nois-db
    databaseName: chama_nois
    user: chama_nois
    plan: basic-256mb
    region: oregon
